<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">chrome-close before and after (proposed: ask before killing)</title>
  <desc id="desc">Left: without chrome-close, each test run Claude starts leaves headless Chrome processes behind and memory use climbs past 1 GB. Right, proposed for issue #1: the second launch is refused, Claude asks the person before ending the listed processes, kills them only after a yes, and the next run goes ahead.</desc>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 14px; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.08em; }
    .fg { fill: #e6edf3; }
    .dim { fill: #8b949e; }
    .tool { fill: #e6edf3; font-weight: 700; }
    .dot { fill: #3fb950; }
    .err { fill: #ff7b72; }
    .warn { fill: #d29922; }
    .ok { fill: #3fb950; }
    .user { fill: #79c0ff; }
  </style>
  <rect width="960" height="560" rx="14" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="959" height="559" rx="14" fill="none" stroke="#30363d"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/>
  <circle cx="44" cy="22" r="6" fill="#febc2e"/>
  <circle cx="64" cy="22" r="6" fill="#28c840"/>
  <line x1="480" y1="44" x2="480" y2="536" stroke="#30363d"/>

  <!-- Before -->
  <text x="32" y="70" class="label" fill="#f85149">BEFORE</text>
  <g class="mono">
    <text x="32" y="106"><tspan class="dot">⏺</tspan><tspan class="tool" dx="8">Bash</tspan><tspan class="fg">(node e2e.mjs)</tspan></text>
    <text x="48" y="132" class="dim">⎿  ✓ 12 passed</text>
    <text x="32" y="174"><tspan class="dot">⏺</tspan><tspan class="tool" dx="8">Bash</tspan><tspan class="fg">(node e2e.mjs)</tspan></text>
    <text x="48" y="200" class="dim">⎿  ✓ 12 passed</text>
    <text x="32" y="242"><tspan class="dot">⏺</tspan><tspan class="tool" dx="8">Bash</tspan><tspan class="fg">(node e2e.mjs)</tspan></text>
    <text x="48" y="268" class="dim">⎿  ✓ 12 passed</text>

    <text x="32" y="322" class="dim">Still running after the scripts ended:</text>
    <text x="48" y="350" class="fg">Google Chrome --headless</text>
    <text x="300" y="350" class="err">×3</text>
    <text x="48" y="374" class="fg">Helper --type=gpu-process</text>
    <text x="300" y="374" class="err">×3</text>
    <text x="48" y="398" class="fg">Helper --type=utility</text>
    <text x="300" y="398" class="err">×6</text>
    <text x="48" y="422" class="fg">Helper --type=renderer</text>
    <text x="300" y="422" class="err">×9</text>
  </g>
  <rect x="32" y="470" width="416" height="12" rx="6" fill="#21262d"/>
  <rect x="32" y="470" width="392" height="12" rx="6" fill="#f85149"/>
  <text x="32" y="510" class="mono dim">Memory held by leftovers: <tspan class="err">1.2 GB</tspan>, growing</text>

  <!-- After (proposed) -->
  <text x="512" y="70" class="label" fill="#3fb950">AFTER <tspan fill="#8b949e">· PROPOSED</tspan></text>
  <g class="mono">
    <text x="512" y="104"><tspan class="dot">⏺</tspan><tspan class="tool" dx="8">Bash</tspan><tspan class="fg">(node e2e.mjs)</tspan></text>
    <text x="528" y="128" class="dim">⎿  ✓ 12 passed</text>

    <text x="512" y="166"><tspan class="err">⏺</tspan><tspan class="tool" dx="8">Bash</tspan><tspan class="fg">(node e2e.mjs)</tspan></text>
    <text x="528" y="190" class="err">⎿  only one headless Chrome may run</text>
    <text x="553" y="212" class="err">at a time: 4 still running</text>
    <text x="553" y="234" class="dim">ask the user before ending them</text>

    <text x="512" y="272"><tspan class="fg">⏺</tspan><tspan class="fg" dx="8">4 headless Chrome processes are</tspan></text>
    <text x="537" y="294" class="fg">still running (PID 75978 …).</text>
    <text x="537" y="316" class="fg">May I end them?</text>

    <text x="512" y="352" class="user">&gt; yes</text>

    <text x="512" y="388"><tspan class="dot">⏺</tspan><tspan class="tool" dx="8">Bash</tspan><tspan class="fg">(kill 75978 76005 76006 76007)</tspan></text>
    <text x="512" y="424"><tspan class="dot">⏺</tspan><tspan class="tool" dx="8">Bash</tspan><tspan class="fg">(node e2e.mjs)</tspan></text>
    <text x="528" y="446" class="dim">⎿  ✓ 12 passed</text>
  </g>
  <rect x="512" y="470" width="416" height="12" rx="6" fill="#21262d"/>
  <rect x="512" y="470" width="56" height="12" rx="6" fill="#3fb950"/>
  <text x="512" y="510" class="mono dim">Nothing is killed without your yes</text>
</svg>
